name: build

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (Qt ${{ matrix.qt }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        qt: [ '6.6.3' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify bundled third-party binaries
        shell: pwsh
        run: ./tools/verify-third-party.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ matrix.qt }}
          arch: win64_mingw
          tools: 'tools_mingw,qt.tools.win64_mingw1120'
          add-tools-to-path: true
          cache: true
          # Qt 6's win64_mingw base package already contains qtdeclarative
          # (QJSEngine). Listing it as a module makes aqt fail with
          # "packages ['qtdeclarative'] were not found".

      - name: Configure
        shell: pwsh
        run: |
          $mingwBin = Join-Path (Split-Path (Split-Path $env:QT_ROOT_DIR)) 'Tools\mingw1120_64\bin'
          if (-not (Test-Path (Join-Path $mingwBin 'g++.exe'))) {
            throw "未找到与 Qt 6.6.3 匹配的 MinGW 11.2：$mingwBin"
          }
          $env:PATH = "$mingwBin;$env:PATH"
          Write-Host "gcc: $((Get-Command gcc).Source)"
          gcc --version | Select-Object -First 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$mingwBin\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$mingwBin\g++.exe"

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        # install-qt-action only exports QT_ROOT_DIR (not PATH), so both the
        # smoke test and the uploaded artifact need the DLLs next to the exes.
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          windeployqt --release --no-translations build\bin\mcsm-cli.exe
          windeployqt --release --no-translations build\bin\McServerManager.exe

          Get-ChildItem build\bin\*.dll | Select-Object -ExpandProperty Name

      - name: Source consistency check
        run: python tools/static_check.py

      - name: Backend smoke test
        shell: pwsh
        run: |
          Write-Host "--- diagnostic ---"
          & .\build\bin\mcsm-cli.exe version
          Write-Host "exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "mcsm-cli 无法启动" }
          ./tools/smoke-test.ps1 -Exe ./build/bin/mcsm-cli.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: McServerManager-${{ matrix.qt }}-win64
          path: build/bin/
          if-no-files-found: error
