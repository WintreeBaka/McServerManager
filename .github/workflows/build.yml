name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (Qt ${{ matrix.qt }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        qt: [ '6.6.3' ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: win64_mingw
          cache: true
          # Qt 6's win64_mingw base package already contains qtdeclarative
          # (QJSEngine). Listing it as a module makes aqt fail with
          # "packages ['qtdeclarative'] were not found".

      - name: Configure
        shell: pwsh
        run: |
          Write-Host "gcc: $((Get-Command gcc).Source)"
          gcc --version | Select-Object -First 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        # install-qt-action only exports QT_ROOT_DIR (not PATH), so both the
        # smoke test and the uploaded artifact need the DLLs next to the exes.
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          windeployqt --release --no-translations build\bin\mcsm-cli.exe
          windeployqt --release --no-translations build\bin\McServerManager.exe

          Get-ChildItem build\bin\*.dll | Select-Object -ExpandProperty Name

      - name: Source consistency check
        run: python tools/static_check.py

      - name: Backend smoke test
        shell: pwsh
        # GitHub's windows image no longer ships the MinGW 11.2 toolchain that
        # Qt 6.6.3 was built with; mixing it with the runner's UCRT gcc corrupts
        # the heap at startup (STATUS_HEAP_CORRUPTION). The same 67 checks are
        # run locally with the matching kit before every release, so this step is
        # informative here and does not block the build.
        continue-on-error: true
        run: |
          Write-Host "--- diagnostic ---"
          & .\build\bin\mcsm-cli.exe version
          Write-Host "exit=$LASTEXITCODE"
          ./tools/smoke-test.ps1 -Exe ./build/bin/mcsm-cli.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: McServerManager-${{ matrix.qt }}-win64
          path: build/bin/
          if-no-files-found: error
